site_name: Secure single-server AI harness
site_description: >-
  Run OpenCode and OpenClaw on one dedicated RHEL 9.8+ host with OpenShell,
  Praxis, and bootc.
site_url: https://redhat-et.github.io/secure-single-server/
repo_url: https://github.com/redhat-et/secure-single-server
repo_name: redhat-et/secure-single-server
edit_uri: edit/main/
copyright: Experimental demonstration, not a production-ready platform.

docs_dir: .docs-build
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/images/redhat-fedora-white.svg
  favicon: assets/images/redhat-favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: README.md
  - Start here:
      - Introduction: docs/README.md
      - Architecture overview: docs/quickstarts/architecture-walkthrough/README.md
      - OpenShell Overview: openshell/docs/README.md
      - Streamlit before and after OpenShell: docs/examples/streamlit-security/README.md
  - Deployment:
      - Deployment methods: docs/deployment-methods.md
      - OpenShell single server:
          - Overview: docs/quickstarts/openshell-single-server/README.md
          - Manual container deployment: docs/quickstarts/openshell-single-server/manual.md
          - Bootc deployment: docs/quickstarts/openshell-single-server/bootc.md
          - Model endpoint configuration: docs/quickstarts/openshell-single-server/model-access.md
          - Verification: docs/quickstarts/openshell-single-server/verification.md
          - Qualification and policy reference: docs/quickstarts/openshell-single-server/reference.md
      - OpenShell + Praxis:
          - Overview: docs/quickstarts/openshell-praxis/README.md
          - Install: docs/quickstarts/openshell-praxis/install.md
          - OpenClaw bounded tasks: docs/quickstarts/openshell-praxis/openclaw.md
          - Integration matrix: docs/quickstarts/openshell-praxis/users.md
      - Experimental llm-d-sc semantic routing: docs/quickstarts/llm-d-sc/README.md
      - Common gateway configuration:
          - Overview: docs/quickstarts/common/README.md
          - Harness configuration: docs/quickstarts/common/harness-configuration.md
          - Provider setup: docs/quickstarts/common/providers.md
          - Token quota reference: docs/quickstarts/common/token-quotas.md
      - All-in-one gateway:
          - Overview: docs/quickstarts/all-in-one/README.md
          - In-memory deployment: docs/quickstarts/all-in-one/in-memory.md
          - Valkey deployment: docs/quickstarts/all-in-one/valkey.md
          - Switchyard deployment: docs/quickstarts/all-in-one/switchyard.md
          - Create a user login: docs/quickstarts/all-in-one/accounts.md
          - User setup and usage: docs/quickstarts/all-in-one/users.md
      - Remote HTTPS/JWT gateway:
          - Overview: docs/quickstarts/remote-gateway/README.md
          - Install: docs/quickstarts/remote-gateway/install.md
          - User setup: docs/quickstarts/remote-gateway/users.md
      - Optional vLLM inference:
          - Mutable RHEL deployment: docs/quickstarts/common/vllm.md
          - Bootc image deployment: bootc/VLLM.md
      - Remote gateway with PriceTag:
          - Guided installation: docs/quickstarts/remote-gateway-pricetag/README.md
          - Manual installation: docs/quickstarts/remote-gateway-pricetag/manual.md
          - Providers and models: docs/quickstarts/remote-gateway-pricetag/providers.md
          - Users, keys and budgets: docs/quickstarts/remote-gateway-pricetag/users.md
          - Saved client configuration: docs/quickstarts/remote-gateway-pricetag/clients.md
          - Price operations and recovery: docs/quickstarts/remote-gateway-pricetag/pricing.md
          - Image options: docs/quickstarts/remote-gateway-pricetag/images.md
          - Architecture and pilot limits: docs/testing/pricetag.md
          - AWS deployment runbook: docs/testing/aws-pricetag.md
          - Performance procedure: docs/testing/pricetag-perf.md
  - Scenarios:
      - Overview: docs/examples/README.md
      - OpenCode PR-candidate queue: docs/examples/opencode-pr-queue/README.md
      - Review as a service: docs/examples/review-service/README.md
      - Praxis token quotas: docs/examples/praxis-quotas/README.md
      - API key theft: docs/examples/api-key-theft/README.md
      - Document exfiltration: docs/examples/document-exfiltration/README.md
      - Model escalation: docs/examples/model-escalation/README.md
  - Development:
      - MaaS and PriceTag image publication: docs/development/pricetag-images.md
  - Testing:
      - Testing guide: docs/testing/README.md
      - Compatibility matrix: docs/testing/compatibility.md
      - Validation records: bootc/VALIDATION.md
      - vLLM validation: bootc/VLLM-VALIDATION.md

extra_css:
  - assets/stylesheets/redhat.css

not_in_nav: |
  bootc/README.md
  docs/quickstarts/bootc/README.md
  docs/quickstarts/podman/README.md
  docs/roadmap.md
  docs/development/documentation-site.md
  docs/development/openshell-upstream.md
  openshell/docs/policy-walkthrough.md
  openshell/docs/threat-model.md
  openshell/harnesses/openclaw/README.md
  openshell/harnesses/opencode/README.md
  openshell/harnesses/opencode/review-agents.md
  openshell/harnesses/opencode/pr-queue/instructions.md
  openshell/demos/streamlit-security/README.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - callouts

hooks:
  - scripts/docs/mkdocs_hooks.py

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/redhat-et/secure-single-server
      name: Secure single-server AI harness on GitHub
