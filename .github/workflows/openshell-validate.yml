name: Validate OpenShell demos

on:
  pull_request:
    paths: ["openshell/**", "configs/templates/**", "configs/openshell-praxis/**", "configs/llm-d-sc/**", "configs/vllm/**", "scripts/openshell-praxis/**", "scripts/common/**", "tests/openshell-praxis/**", "tests/policy-boundary/**", "bootc/**", ".github/workflows/openshell-validate.yml", ".github/actionlint.yaml"]
  push:
    branches: [main]
    paths: ["openshell/**", "configs/templates/**", "configs/openshell-praxis/**", "configs/llm-d-sc/**", "configs/vllm/**", "scripts/openshell-praxis/**", "scripts/common/**", "tests/openshell-praxis/**", "tests/policy-boundary/**", "bootc/**", ".github/workflows/openshell-validate.yml", ".github/actionlint.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static analysis runs inside a Red Hat UBI 9 container (RHEL 9 userspace) on a
  # standard GitHub-hosted x64 runner. UBI is freely pullable without a
  # subscription, so this matches the target RHEL 9 platform with no dedicated
  # runner and no cost. arm64 is intentionally not covered.
  static:
    name: OpenShell static (RHEL 9 / UBI9)
    runs-on: ubuntu-24.04
    container:
      image: registry.access.redhat.com/ubi9/ubi@sha256:16e9e43d99e181463513cc84a514859b1abb9460f1c4d9e208da4b4e51cd5cc3
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Install tools
        run: |
          # python3, PyYAML, and tar/xz come from RHEL repos; shellcheck and
          # ripgrep are not packaged for UBI, so install pinned static binaries.
          # UBI 9 defaults to Node 16; the probe needs the standard fetch API.
          dnf module enable -y nodejs:22
          dnf install -y python3 python3-pyyaml nodejs tar xz findutils
          RG_VER=14.1.1
          RG_SHA256=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VER}/ripgrep-${RG_VER}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/rg.tar.gz
          printf '%s  /tmp/rg.tar.gz\n' "${RG_SHA256}" | sha256sum -c -
          tar -C /tmp -xf /tmp/rg.tar.gz
          install -m 0755 "/tmp/ripgrep-${RG_VER}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version
          SC_VER=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.xz" -o /tmp/sc.tar.xz
          tar -C /tmp -xf /tmp/sc.tar.xz
          install -m 0755 "/tmp/shellcheck-${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Install pinned OpenShell policy prover
        run: |
          OPENSHELL_PROVER_VERSION=v0.1.4
          OPENSHELL_PROVER_SHA256=dcf52ed3b8c81a1ab15842653667090a28bc24eefa9ba76660a82fe0e78ecc43
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "https://github.com/NVIDIA/OpenShell/releases/download/${OPENSHELL_PROVER_VERSION}/openshell-prover-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/openshell-prover.tar.gz
          printf '%s  /tmp/openshell-prover.tar.gz\n' "${OPENSHELL_PROVER_SHA256}" | sha256sum -c -
          tar -xzf /tmp/openshell-prover.tar.gz -C /tmp
          install -m 0755 /tmp/openshell-prover /usr/local/bin/openshell-prover
          openshell-prover --version
      - name: Static checks
        run: |
          bash openshell/tests/openshell-static.sh
          python3 openshell/tests/probe-test.py
          python3 tests/openshell-praxis/offline.py
          python3 bootc/tests/inference.py
      - name: Native architecture check
        env: {EXPECTED_ARCH: amd64}
        run: |
          source scripts/common/lib.sh
          test "$(oci_architecture "$(uname -m)")" = amd64

  # Opt-in only on a disposable pre-provisioned RHEL 9 x86_64 host.
  # Never execute pull-request code on a privileged self-hosted runner.
  runtime:
    name: OpenShell runtime (RHEL 9 fixture)
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.OPENSHELL_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, Linux, X64, rhel9, openshell-disposable]
    # Paired cleanup may await the pinned gateway's five-minute orphan grace.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Run one fixture lifecycle (synthetic model and credentials only)
        run: sudo bash openshell/tests/runtime.sh

  openclaw-client:
    name: Pinned OpenClaw model and tool contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Exercise streamed tool turns and credential handling through Praxis
        env: {CONTAINER_ENGINE: docker}
        # The upstream UID 1000 creates private state/proof files. Run the
        # fixture as root, as qualified on AWS, so independent readback and
        # cleanup work on hosted runners whose login UID is 1001.
        run: sudo env CONTAINER_ENGINE=docker python3 tests/openshell-praxis/openclaw-native.py
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openclaw-client-contract
          path: evidence/mocked-provider/openclaw-native.json
          retention-days: 7

  opencode-client:
    name: Pinned OpenCode model and tool contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Exercise streamed file and command tools through Praxis
        env: {CONTAINER_ENGINE: docker}
        run: python3 tests/openshell-praxis/opencode-native.py
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencode-client-contract
          path: evidence/mocked-provider/opencode-native.json
          retention-days: 7
